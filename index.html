<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Simple Timer</title>
</head>

<body>
    <div class="container">
        <div class="timer">
            <input type="text" id="duration" value="30">
            <div id="control">
                <button id="start"><i class="fa-solid fa-play"></i></button>
                <button id="pause"><i class="fa-solid fa-pause"></i></button>
            </div>
            <svg class="shape" height="400" width="400">
                <circle r="180" cx="200" cy="200" fill="transparent" stroke="#606c38" stroke-width="25"
                    transform="rotate(-90 200 200)">
                </circle>
            </svg>
        </div>



    </div>
    <script src="timer.js"></script>
    <script src="index.js"></script>
</body>

</html>
